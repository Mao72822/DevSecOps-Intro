# Written to violate labs/lab9/policies/extra/hardening.rego and nothing else:
# it is juice-hardened.yaml with the image pinned by tag instead of digest
# and an explicit low runAsUser. Every shipped k8s-security.rego check still passes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-violates-extra
spec:
  replicas: 1
  selector:
    matchLabels: { app: juice }
  template:
    metadata:
      labels: { app: juice }
    spec:
      containers:
        - name: juice
          image: bkimminich/juice-shop:v19.0.0   # tag, not digest -> deny
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000                      # below 10000 -> warn
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 20
